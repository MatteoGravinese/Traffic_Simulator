<!DOCTYPE html>
<html>
<head>
    <title>Traffic Simulator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([40.4406, -79.9959], 13); // Pittsburgh
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let lines = [];

        function congestionToColor(value) {
            // Clamp between 0 and 1
            const t = Math.min(value, 1.0);
            const r = Math.round(255 * t);
            const g = Math.round(255 * (1 - t));
            return `rgb(${r},${g},0)`;
        }

        function refresh() {
            fetch('/congestion')
                .then(res => res.json())
                .then(data => {
                    // Remove old lines
                    lines.forEach(l => map.removeLayer(l));
                    lines = [];
                    // Draw new lines
                    data.forEach(edge => {
                        const line = L.polyline(
                            [[edge.from_lat, edge.from_lon], [edge.to_lat, edge.to_lon]],
                            { color: congestionToColor(edge.congestion), weight: 3, opacity: 0.8 }
                        ).addTo(map);
                        lines.push(line);
                    });
                });
        }

        // Poll every 2 seconds
        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
